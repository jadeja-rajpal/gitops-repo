apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-app-third
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:jadeja-rajpal/gitops-repo.git
    targetRevision: main
    path: charts/myapp
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
